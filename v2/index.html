<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Garagem Exemplo · Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tinta:#14181f;--suave:#5d6673;--linha:#e3e6ea;--marca:#0f2a44;--acento:#e8a317;--zap:#1fa855;--vend:#c0392b;--res:#d68910}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tinta);min-height:100vh;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.faixa{background:#fff6dc;color:#7a5600;font-size:12px;text-align:center;padding:6px 16px;border-bottom:1px solid #f0dfaa}
header{background:var(--marca);color:#fff;position:sticky;top:0;z-index:20}
.topo{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px;font-size:18px}
.logo i{width:34px;height:34px;border-radius:9px;background:var(--acento);display:grid;place-items:center;color:var(--marca);font-style:normal;font-size:17px}
.logo span{white-space:nowrap;text-align:left}
.logo small{display:block;font-weight:500;font-size:11px;opacity:.75;letter-spacing:0}
.topo .esp{flex:1}
.topo button.ic{color:#fff;opacity:.9;font-size:13px;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px}
.topo button.ic:hover{background:rgba(255,255,255,.1)}
@media(max-width:500px){.topo .rot{display:none}.logo{font-size:16px}}
body.sem-zap .zapfixo{display:none}
body.painel .busca{display:none}
.busca{max-width:1180px;margin:0 auto;padding:0 16px 14px}
.busca div{display:flex;align-items:center;background:#fff;border-radius:12px;padding:0 12px;gap:8px}
.busca input{flex:1;border:0;outline:0;padding:13px 0;font-size:15px;background:none;min-width:0}
.busca svg{flex:none}
main{max-width:1180px;margin:0 auto;padding:16px}
h2{scroll-margin-top:180px;font-size:17px;font-weight:700;margin:22px 0 12px;display:flex;align-items:baseline;gap:8px}
h2 small{font-weight:500;color:var(--suave);font-size:13px}
.marcas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(min-width:700px){.marcas{grid-template-columns:repeat(7,1fr)}}
.marca{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.15s}
.marca:hover{border-color:var(--marca);transform:translateY(-1px)}
.marca.on{border-color:var(--marca);box-shadow:0 0 0 2px var(--marca) inset}
.marca svg{width:38px;height:38px;fill:var(--marca)}
.marca b{font-size:11.5px;font-weight:600}
.marca span{font-size:11px;color:var(--suave)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--linha);background:#fff;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:500}
.chip.on{background:var(--marca);color:#fff;border-color:var(--marca)}
.grade{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:600px){.grade{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grade{grid-template-columns:repeat(3,1fr)}}
.car{background:var(--card);border:1px solid var(--linha);border-radius:16px;overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative;transition:.15s}
.car:hover{box-shadow:0 6px 20px rgba(15,42,68,.10)}
.foto{aspect-ratio:16/9;background:linear-gradient(180deg,#e9edf2,#d5dbe3);display:grid;place-items:center;position:relative;overflow:hidden}
.foto svg{width:78%;height:auto}
.foto img{width:100%;height:100%;object-fit:cover}
.foto .leg{position:absolute;bottom:6px;right:8px;font-size:10px;color:#8a94a1}
.selo{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;color:#fff;padding:4px 9px;border-radius:6px;letter-spacing:.4px}
.selo.vendido{background:var(--vend)}.selo.reservado{background:var(--res)}.selo.novo{background:var(--zap)}
.fav{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:2}
.fav svg{width:19px;height:19px;fill:none;stroke:#4a5260;stroke-width:2}
.fav.on svg{fill:#e0245e;stroke:#e0245e}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.info .tit{font-weight:700;font-size:15px;line-height:1.3}
.info .tit small{display:block;font-weight:500;color:var(--suave);font-size:12px;margin-bottom:2px}
.info .dados{font-size:12.5px;color:var(--suave);display:flex;flex-wrap:wrap;gap:4px 10px}
.info .preco{font-size:19px;font-weight:800;color:var(--marca);margin-top:2px}
.car.vendido .foto,.car.vendido .info{opacity:.55}
.vazio{background:#fff;border:1px dashed var(--linha);border-radius:14px;padding:28px;text-align:center;color:var(--suave)}
.filtro-ativo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.filtro-ativo button{font-size:13px;color:var(--marca);font-weight:600;text-decoration:underline}
.loja{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:16px;display:grid;gap:10px;margin-top:22px}
@media(min-width:700px){.loja{grid-template-columns:repeat(3,1fr)}}
.loja div{font-size:13.5px;color:var(--suave)}.loja b{display:block;color:var(--tinta);font-size:14px;margin-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px}
.btn.zap{background:var(--zap);color:#fff}
.btn.sec{background:#fff;border:1px solid var(--linha)}
.btn.pri{background:var(--marca);color:#fff}
.zapfixo{position:fixed;right:16px;bottom:16px;z-index:30;width:58px;height:58px;border-radius:50%;background:var(--zap);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.zapfixo svg{width:30px;height:30px;fill:#fff}
/* ficha */
.voltar{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--marca);margin-bottom:12px;font-size:14px}
.ficha{display:grid;gap:18px}
@media(min-width:900px){.ficha{grid-template-columns:1.25fr 1fr;align-items:start}}
.galeria .foto{border-radius:16px;aspect-ratio:4/3}
.miniaturas{display:flex;gap:8px;margin-top:8px}
.miniaturas div{flex:1;aspect-ratio:4/3;border-radius:10px;background:linear-gradient(180deg,#e9edf2,#d5dbe3);display:grid;place-items:center;font-size:10px;color:#8a94a1;border:2px solid transparent}
.miniaturas div.on{border-color:var(--marca)}
.painel-ficha{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.painel-ficha h1{font-size:22px;line-height:1.25}
.painel-ficha h1 small{display:block;font-size:13px;color:var(--suave);font-weight:600;margin-bottom:4px}
.painel-ficha .preco{font-size:28px;font-weight:800;color:var(--marca)}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:500px){.specs{grid-template-columns:repeat(3,1fr)}}
.spec{background:var(--bg);border-radius:12px;padding:10px 12px}
.spec span{display:block;font-size:11px;color:var(--suave)}
.spec b{font-size:14px}
.opc{display:flex;flex-wrap:wrap;gap:6px}
.opc span{font-size:12px;background:#eef2f6;border-radius:99px;padding:5px 10px}
.cod{font-size:12px;color:var(--suave)}
/* modal */
.fundo{position:fixed;inset:0;background:rgba(10,20,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.fundo.on{display:flex}
@media(min-width:700px){.fundo{align-items:center}}
.modal{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.modal h3{font-size:17px}
.bolha{background:#dcf8c6;border-radius:12px 12px 2px 12px;padding:12px 14px;font-size:14px;line-height:1.45;white-space:pre-wrap;align-self:flex-end;max-width:92%}
.modal p{font-size:13px;color:var(--suave)}
/* painel corretor */
.form{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:16px;display:grid;gap:12px}
@media(min-width:700px){.form{grid-template-columns:repeat(2,1fr)}}
.form label{font-size:12.5px;font-weight:600;display:flex;flex-direction:column;gap:5px}
.form input,.form select{border:1px solid var(--linha);border-radius:10px;padding:11px 12px;font-size:15px;background:#fff;width:100%}
.form .full{grid-column:1/-1}
.upl{border:1px dashed #b9c2cd;border-radius:12px;padding:16px;text-align:center;font-size:13px;color:var(--suave);cursor:pointer;display:block}
.lista-adm{display:flex;flex-direction:column;gap:8px}
.adm{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.adm .t{flex:1;min-width:0;font-size:13.5px}
.adm .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm .t span{color:var(--suave);font-size:12px}
.adm select{border:1px solid var(--linha);border-radius:8px;padding:7px 8px;font-size:13px;background:#fff}
.passos{display:flex;gap:10px;font-size:12.5px;color:var(--suave);flex-wrap:wrap}
.passos span{background:#eef2f6;border-radius:8px;padding:5px 9px}
.aviso-ok{background:#e7f6ec;color:#1b6b37;border-radius:10px;padding:10px 12px;font-size:13.5px;display:none}
footer{text-align:center;font-size:12px;color:var(--suave);padding:26px 16px 0}
</style>
</head>

 $('#app').innerHTML=`<button class="voltar" onclick="ir('')">← Ver o site</button>

 ${extras.length||Object.keys(statusMud).length?'<p style="margin-top:12px;font-size:12px;color:var(--suave)">Mudanças desta prévia ficam só neste aparelho. <button style="text-decoration:underline;font-size:12px;color:var(--marca)" onclick="zerar()">voltar ao estoque de exemplo</button></p>':''}`;

 const u=$('.upl').dataset.url;if(u)fotos[id]=u;extras.unshift(c);gravar('ge_extras',extras);telaPainel();$('#ok').style.display='block';$('#ok').innerHTML=`Publicado! <b>${MARCAS[c.marca].nome} ${c.modelo}</b> já aparece em “Chegaram agora”. <a href="#" onclick="ir('');return false">ver no site</a>`}

function zap(msg){msg=msg||'Olá! Vim pelo site da Garagem Exemplo.';$('#modal').innerHTML=`<h3>WhatsApp do corretor</h3><p>Na versão real, este botão abre o WhatsApp do corretor já com a mensagem escrita:</p><div class="bolha">${msg}</div><p>Assim o cliente chega dizendo <b>qual</b> carro quer.</p><button class="btn pri" onclick="fechar()">Entendi</button>`;$('#fundo').classList.add('on')}
function fechar(){$('#fundo').classList.remove('on')}
function ir(r){if(location.hash.slice(1)===r)rota();else location.hash=r}
function rota(){const h=decodeURIComponent(location.hash.slice(1));window.scrollTo(0,0);
 document.body.classList.toggle('sem-zap',h.startsWith('carro/')||h==='painel');document.body.classList.toggle('painel',h==='painel');
 if(h.startsWith('carro/'))telaCarro(h.slice(6));else if(h==='painel')telaPainel();else if(h==='favoritos')telaFavoritos();else telaInicio()}
$('#q').addEventListener('input',e=>{st.q=e.target.value;if(location.hash&&location.hash!=='#'){location.hash=''}else telaInicio()});
addEventListener('hashchange',rota);contarFav();rota();
